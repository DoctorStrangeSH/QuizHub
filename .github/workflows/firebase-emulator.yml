name: Firebase emulator integration

on:
  pull_request:
  push:
    branches: [refactor/foundation-stability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and compile Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run --prefix functions build
          npm run --prefix functions check
      - name: Network test against isolated Firebase emulators
        env:
          GCLOUD_PROJECT: demo-quizhub
          GOOGLE_CLOUD_PROJECT: demo-quizhub
          CI: 'true'
        run: >-
          npx --yes firebase-tools@latest emulators:exec
          --project demo-quizhub
          --only auth,firestore,functions
          "node --test tests/firebase-auth-emulator.test.mjs tests/firebase-daily-emulator.test.mjs"
