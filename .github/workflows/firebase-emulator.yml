name: Firebase emulator integration

on:
  pull_request:
  push:
    branches: [refactor/foundation-stability]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and compile Functions
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run --prefix functions build
          npm run --prefix functions check
      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Network and browser tests against isolated Firebase emulators
        env:
          GCLOUD_PROJECT: demo-quizhub
          GOOGLE_CLOUD_PROJECT: demo-quizhub
          CI: 'true'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          npx --yes firebase-tools@latest emulators:exec \
            --project demo-quizhub --only auth,firestore,functions \
            "node --test tests/firebase-auth-emulator.test.mjs tests/firebase-daily-emulator.test.mjs tests/firebase-shop-emulator.test.mjs tests/firebase-achievement-emulator.test.mjs tests/firebase-browser-auth.test.mjs tests/firebase-quiz-browser.test.mjs tests/firebase-classic-server-browser.test.mjs tests/firebase-daily-login-browser.test.mjs tests/firebase-daily-challenge-browser.test.mjs tests/firebase-daily-challenge-ui-browser.test.mjs functions/test-server-mode-ui-browser.mjs tests/firebase-public-profile-backfill.test.mjs functions/test-quiz-firestore-emulator.mjs functions/test-daily-ranking-emulator.mjs functions/test-quiz-callable-emulator.mjs functions/test-quiz-mode-callable-emulator.mjs functions/test-public-profile-sync-emulator.mjs functions/test-profile-rename-emulator.mjs functions/test-nickname-claims-apply-emulator.mjs functions/test-profile-create-emulator.mjs functions/test-profile-create-callable-emulator.mjs functions/test-friend-callable-emulator.mjs functions/test-backup-restore-emulator.mjs functions/test-firestore-backup-codec.mjs"
      - name: Capture a complete read-only snapshot in fresh Firestore emulator
        env:
          GCLOUD_PROJECT: demo-quizhub
          GOOGLE_CLOUD_PROJECT: demo-quizhub
          CI: 'true'
        run: npx --yes firebase-tools@latest emulators:exec --project demo-quizhub --only firestore "node --test functions/test-backup-capture-emulator.mjs"
      - name: Verify server-owned sessions reject all client access
        env:
          GCLOUD_PROJECT: demo-quizhub
          GOOGLE_CLOUD_PROJECT: demo-quizhub
          CI: 'true'
        run: npx --yes firebase-tools@latest emulators:exec --config firebase.rules-preview.json --project demo-quizhub --only auth,firestore "node --test functions/test-quiz-session-rules-emulator.mjs"
