name: QuizHub visual preview

on:
  push:
    branches: [refactor/foundation-stability]
    paths:
      - 'app/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'scripts/browser-preview.mjs'
      - '.github/workflows/visual-preview.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check desktop and mobile guest experience
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          node scripts/browser-preview.mjs
      - name: Save actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quizhub-visual-preview
          path: artifacts/quizhub-preview/
          if-no-files-found: warn
          retention-days: 5
