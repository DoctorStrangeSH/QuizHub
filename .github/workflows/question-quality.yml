name: Question quality

on:
  push:
    branches: [main, refactor/foundation-stability]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-questions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authentication module syntax and UI contract
        run: |
          node --check app/modules/auth/auth.js
          node --test tests/auth-interface.test.mjs
      - name: Verify Midnight Arcade design system
        run: node --test tests/visual-system.test.mjs
      - name: Verify lobby design and selection behavior
        run: node --test tests/lobby-design.test.mjs
      - name: Verify responsive playable quiz design
        run: node --test tests/quiz-round-design.test.mjs
      - name: Verify accessible answer feedback and score updates
        run: node --test tests/answer-feedback.test.mjs
      - name: Verify quiz finale accuracy and reward presentation
        run: node --test tests/quiz-finale-design.test.mjs
      - name: Verify collectible shop and achievements design
        run: node --test tests/collection-design.test.mjs
      - name: Verify responsive player identity card
        run: node --test tests/player-card-design.test.mjs
      - name: Verify leaderboard arena and keyboard navigation
        run: node --test tests/leaderboard-design.test.mjs
      - name: Verify friends social club design and safe player names
        run: node --test tests/social-club-design.test.mjs
      - name: Test emulator-only friendship browser transport and UI gate
        run: node --experimental-default-type=module --test tests/firebase-friend-invoker.test.mjs tests/friendship-client.test.mjs tests/friendship-client-integration.test.mjs
      - name: Syntax-check friendship browser modules
        run: |
          node --check app/firebase-config.js
          node --check app/modules/friends/friends.js
          node --check app/modules/friends/firebase-friend-invoker.js
          node --check app/modules/friends/friendship-client.js
      - name: Test transactional friendship transitions and authenticated boundary
        run: node --experimental-default-type=module --test tests/server-friend-relationships.test.mjs tests/server-friend-callable.test.mjs
      - name: Verify messenger display and secure chat rendering
        run: node --test tests/messenger-design.test.mjs
      - name: Test trusted CHAT-01 and CHAT-02 service and callable boundaries
        run: node --experimental-default-type=module --test tests/server-chat-messages.test.mjs tests/server-chat-send-callable.test.mjs tests/server-chat-history.test.mjs tests/server-chat-history-callable.test.mjs tests/server-chat-message-mutations.test.mjs tests/server-chat-message-mutation-callable.test.mjs tests/server-chat-message-reactions.test.mjs tests/server-chat-reaction-callable.test.mjs tests/server-chat-read-receipts.test.mjs tests/server-chat-read-receipt-callable.test.mjs
      - name: Verify tournament hall and daily reward visuals
        run: node --test tests/event-hall-design.test.mjs
      - name: Test PWA refresh and mobile visual overrides
        run: node --test tests/pwa-visual-refresh.test.mjs
      - name: Verify QuizHub branded PWA and launch screen
        run: node --test tests/brand-identity.test.mjs
      - name: Test local trusted profile creation transport
        run: node --experimental-default-type=module --test tests/client-profile-create-invoker.test.mjs
      - name: Syntax-check profile creation browser module
        run: node --check app/modules/profile/profile.js
      - name: Test privacy-safe public profile projection
        run: node --experimental-default-type=module --test tests/public-profile-data.test.mjs
      - name: Verify centralized profile read migration gate
        run: node --experimental-default-type=module --test tests/profile-read-source.test.mjs
      - name: Verify viewer-safe profile projection and card rendering
        run: node --experimental-default-type=module --test tests/profile-viewer-projection.test.mjs
      - name: Test collision-safe nickname claims migration planner
        run: node --experimental-default-type=module --test tests/nickname-claims-backfill.test.mjs
      - name: Audit legacy account migration readiness without writes
        run: node --experimental-default-type=module --test tests/legacy-account-audit.test.mjs
      - name: Verify legacy private, social and game data preservation
        run: node --experimental-default-type=module --test tests/legacy-data-preservation.test.mjs
      - name: Verify repository-derived Firestore migration inventory
        run: node --experimental-default-type=module --test tests/firestore-migration-inventory.test.mjs
      - name: Test read-only live Firestore inventory collector
        run: node --test tests/firestore-live-inventory.test.mjs
      - name: Check guarded Firestore inventory CLI syntax
        run: node --check functions/scripts/firestore-live-inventory.mjs
      - name: Test complete backup integrity manifests and checksums
        run: node --experimental-default-type=module --test tests/backup-integrity.test.mjs
      - name: Test trusted public profile synchronization
        run: node --experimental-default-type=module --test tests/server-public-profile-sync.test.mjs
      - name: Test dry-run public profile migration planner
        run: node --experimental-default-type=module --test tests/public-profile-backfill.test.mjs
      - name: Validate quiz questions
        run: node --experimental-default-type=module scripts/validate-questions.mjs
      - name: Test quiz rewards
        run: node --experimental-default-type=module --test tests/quiz-rewards.test.mjs
      - name: Test deterministic daily challenge selection
        run: node --experimental-default-type=module --test tests/daily-challenge.test.mjs
      - name: Test transactional server daily challenge
        run: node --experimental-default-type=module --test tests/server-daily-challenge.test.mjs
      - name: Test authenticated daily challenge boundary
        run: node --experimental-default-type=module --test tests/server-authenticated-daily-challenge.test.mjs
      - name: Test secure daily leaderboard projection
        run: node --experimental-default-type=module --test tests/server-daily-leaderboard.test.mjs
      - name: Test Firebase callable boundary
        run: node --experimental-default-type=module --test tests/server-firebase-daily-callable.test.mjs
      - name: Enforce emulator-only guards on exported callables
        run: node --test tests/firebase-callable-emulator-guards.test.mjs
      - name: Syntax-check trusted chat services
        run: |
          node --check server/chat-messages.mjs
          node --check server/chat-send-callable-adapter.mjs
          node --check server/chat-history.mjs
          node --check server/chat-history-callable-adapter.mjs
          node --check server/chat-message-mutations.mjs
          node --check server/chat-message-mutation-callable-adapter.mjs
          node --check server/chat-message-reactions.mjs
          node --check server/chat-reaction-callable-adapter.mjs
          node --check server/chat-read-receipts.mjs
          node --check server/chat-read-receipt-callable-adapter.mjs
      - name: Build Firebase Functions bundle
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm run --prefix functions build
          npm run --prefix functions check
      - name: Test Firestore daily persistence adapter
        run: node --experimental-default-type=module --test tests/server-daily-firestore-store.test.mjs
      - name: Test end-of-day ranking sealing
        run: node --experimental-default-type=module --test tests/server-daily-ranking-seal.test.mjs
      - name: Test sealed daily prize claims
        run: node --experimental-default-type=module --test tests/server-daily-prize.test.mjs
      - name: Test complete ranked daily flow across players
        run: node --experimental-default-type=module --test tests/server-daily-complete-flow.test.mjs
      - name: Test daily challenge browser client and emulator invoker
        run: node --experimental-default-type=module --test tests/daily-challenge-client.test.mjs tests/firebase-daily-challenge-invoker.test.mjs
      - name: Syntax-check server Daily Challenge preview integration
        run: |
          node --check app/modules/quiz/quiz.js
          node --check app/modules/quiz/daily-challenge-preview-screen.js
          node --check app/modules/quiz/daily-challenge-client.js
          node --check app/modules/quiz/firebase-daily-challenge-invoker.js
          node --check app/modules/quiz/firebase-daily-challenge-preview.js
          node --check app/modules/quiz/daily-challenge-preview-screen.js
      - name: Test daily result summaries
        run: node --experimental-default-type=module --test tests/daily-results.test.mjs
      - name: Test daily challenge mode
        run: node --experimental-default-type=module --test tests/daily-challenge-mode.test.mjs
      - name: Test UTC daily countdown and rollover
        run: node --experimental-default-type=module --test tests/daily-countdown.test.mjs
      - name: Test daily challenge dashboard
        run: node --experimental-default-type=module --test tests/daily-challenge-dashboard.test.mjs
      - name: Test quiz session lifecycle
        run: node --experimental-default-type=module --test tests/quiz-session.test.mjs
      - name: Test timed events and reward boosts
        run: node --experimental-default-type=module --test tests/quiz-events.test.mjs
      - name: Audit quiz economy write boundary
        run: node --experimental-default-type=module --test tests/quiz-economy-boundary.test.mjs
      - name: Test server-side quiz session rules
        run: node --experimental-default-type=module --test tests/server-quiz-session.test.mjs
      - name: Test V1 server mode scoring primitives
        run: node --experimental-default-type=module --test tests/server-quiz-mode-rules.test.mjs
      - name: Test V1 server mode session transitions
        run: node --experimental-default-type=module --test tests/server-quiz-mode-session.test.mjs
      - name: Test canonical server mode answer core
        run: node --experimental-default-type=module --test tests/server-quiz-mode-answer-core.test.mjs
      - name: Test Classic browser callable transport
        run: node --experimental-default-type=module --test tests/client-classic-invoker.test.mjs tests/server-classic-mode-client.test.mjs
      - name: Syntax-check Classic server preview integration
        run: |
          node --check app/modules/quiz/quiz.js
          node --check app/modules/quiz/server-mode-preview-screen.js
          node --check app/modules/quiz/server-mode-client.js
      - name: Test persisted server mode session lifecycle
        run: node --experimental-default-type=module --test tests/server-quiz-mode-session-service.test.mjs
      - name: Test Firestore quiz session and reward adapter
        run: node --experimental-default-type=module --test tests/server-quiz-firestore-store.test.mjs
      - name: Test transactional shop purchase service
        run: node --experimental-default-type=module --test tests/server-shop-purchase-service.test.mjs tests/server-shop-firestore-store.test.mjs
      - name: Test authenticated shop callable boundary
        run: node --experimental-default-type=module --test tests/server-authenticated-shop-handler.test.mjs tests/server-firebase-shop-callable.test.mjs
      - name: Test local browser shop preview transport
        run: node --experimental-default-type=module --test tests/client-shop-invoker.test.mjs
      - name: Syntax-check shop browser module
        run: node --check app/modules/shop/shop.js
      - name: Test daily login reward service and callable
        run: node --experimental-default-type=module --test tests/server-daily-login-reward-service.test.mjs tests/server-daily-login-firestore-store.test.mjs tests/server-daily-login-callable.test.mjs
      - name: Test local browser daily login preview transport and receipt mapping
        run: node --experimental-default-type=module --test tests/client-daily-login-invoker.test.mjs
      - name: Syntax-check daily login browser module
        run: node --check app/modules/daily/daily.js
      - name: Test trusted XP level progression and achievement thresholds
        run: node --experimental-default-type=module --test tests/server-achievement-progress.test.mjs
      - name: Test local browser achievement preview transport
        run: node --experimental-default-type=module --test tests/client-achievement-invoker.test.mjs
      - name: Syntax-check achievements browser module
        run: node --check app/modules/achievements/achievements.js
      - name: Test achievement unlock service and callable
        run: node --experimental-default-type=module --test tests/server-achievement-unlock-service.test.mjs tests/server-achievement-firestore-store.test.mjs tests/server-achievement-callable.test.mjs tests/server-quiz-reward-claim.test.mjs tests/server-quiz-mode-reward-claim.test.mjs
      - name: Test server mode Firestore persistence and retries
        run: node --experimental-default-type=module --test tests/server-mode-firestore-persistence.test.mjs

      - name: Test atomic reward claim contract
        run: node --experimental-default-type=module --test tests/server-quiz-reward-claim.test.mjs
      - name: Test atomic Duel Survival and Time Trial reward claims
        run: node --experimental-default-type=module --test tests/server-quiz-mode-reward-claim.test.mjs
      - name: Test private question delivery contract
        run: node --experimental-default-type=module --test tests/server-question-delivery.test.mjs
      - name: Test complete server quiz lifecycle
        run: node --experimental-default-type=module --test tests/server-quiz-service.test.mjs

      - name: Test real question bank against server catalog
        run: node --experimental-default-type=module --test tests/server-real-question-bank.test.mjs

      - name: Test authenticated quiz request boundary
        run: node --experimental-default-type=module --test tests/server-authenticated-quiz-handler.test.mjs

      - name: Test verified quiz callable transport boundary
        run: node --experimental-default-type=module --test tests/server-firebase-quiz-callable.test.mjs
      - name: Test authenticated Duel Survival and Time Trial boundary
        run: node --experimental-default-type=module --test tests/server-authenticated-mode-handler.test.mjs
      - name: Test browser server mode transport contract
        run: node --experimental-default-type=module --test tests/client-server-mode-transport.test.mjs
      - name: Test browser server mode session controller
        run: node --experimental-default-type=module --test tests/client-mode-session-controller.test.mjs
      - name: Test Time Trial countdown clock
        run: node --experimental-default-type=module --test tests/time-trial-clock.test.mjs
      - name: Test Survival lives and feedback UI
        run: node --experimental-default-type=module --test tests/survival-feedback-ui.test.mjs
      - name: Test Duel round results UI
        run: node --experimental-default-type=module --test tests/duel-round-results-ui.test.mjs
      - name: Syntax-check server mode preview screen
        run: node --check app/modules/quiz/server-mode-preview-screen.js
      - name: Test browser server mode session storage
        run: node --experimental-default-type=module --test tests/client-mode-session-storage.test.mjs
      - name: Syntax-check isolated server mode preview screen
        run: node --check app/modules/quiz/server-mode-preview-screen.js
      - name: Test emulator-only Firebase mode invoker
        run: node --experimental-default-type=module --test tests/firebase-mode-invoker.test.mjs

      - name: Test authenticated full quiz flow across users
        run: node --experimental-default-type=module --test tests/server-authenticated-quiz-flow.test.mjs

      - name: Test safe question HTML rendering
        run: node --experimental-default-type=module --test tests/quiz-html-escaping.test.mjs

      - name: Test accurate quiz countdown
        run: node --experimental-default-type=module --test tests/quiz-timer.test.mjs

      - name: Test navigating during quiz startup
        run: node --experimental-default-type=module --test tests/quiz-render-navigation.test.mjs
