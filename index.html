<!DOCTYPE html>
<html lang="ru" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quiz Empire" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>" />
    <title>Quiz Empire</title>

    <!-- Splash screen -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            overflow: hidden;
        }

        #initial-splash {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #initial-splash.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-inner {
            text-align: center;
        }

        .splash-logo {
            font-size: 4rem;
            animation: pulse 2s ease infinite;
            margin-bottom: 24px;
        }

        .splash-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #7c5cfc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        .splash-text {
            color: #9898b0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(1.1)
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }
    </style>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="app/styles/themes.css" rel="stylesheet" />
    <link href="app/styles/main.css" rel="stylesheet" />
    <link href="app/modules/auth/auth.css" rel="stylesheet" />
    <link href="app/modules/profile/profile.css" rel="stylesheet" />
    <link href="app/modules/dashboard/dashboard.css" rel="stylesheet" />
    <link href="app/modules/friends/friends.css" rel="stylesheet" />
    <link href="app/modules/quiz/quiz.css" rel="stylesheet" />
    <link href="app/modules/leaderboard/leaderboard.css" rel="stylesheet" />
    <link href="app/modules/achievements/achievements.css" rel="stylesheet" />
    <link href="app/modules/shop/shop.css" rel="stylesheet" />
    <link href="app/modules/chat/chat.css" rel="stylesheet" />
    <link href="app/modules/events/events.css" rel="stylesheet" />
    <link href="app/modules/loader/loader.css" rel="stylesheet" />
</head>

<body>
    <div id="initial-splash">
        <div class="splash-inner">
            <div class="splash-logo">👑</div>
            <div class="splash-spinner"></div>
            <p class="splash-text">Загрузка...</p>
        </div>
    </div>

    <div id="app-root"></div>
    <canvas id="particles-canvas"></canvas>

    <script type="module">
        import './app/firebase-config.js';
        import './app/modules/particles/particles.js';
        import './app/app.js';

        // Регистрируем Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('✅ SW registered'))
                .catch(err => console.log('SW registration skipped:', err));
        }
    </script>
</body>

</html>
