<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QuizHub" />
    <meta name="description" content="QuizHub — играй в квизы, открывай новое и соревнуйся с друзьями." />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./app/assets/quizhub-mark.svg" />
    <title>QuizHub — мир викторин</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; background: #080d19; overflow: hidden; }
        #initial-splash { position: fixed; inset: 0; background: radial-gradient(circle at 50% 37%, #18213a 0%, #080d19 64%); display: flex; align-items: center; justify-content: center; z-index: 99999; transition: opacity .4s ease, visibility .4s ease; }
        #initial-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-inner { text-align: center; }
        .splash-logo { display: block; width: 100px; height: 100px; margin: 0 auto 20px; animation: pulse 2s ease infinite; filter: drop-shadow(0 12px 32px rgba(184,250,85,.13)); }
        .splash-name { color: #f3f7ff; font: 900 1.5rem 'Trebuchet MS','Segoe UI',sans-serif; letter-spacing: .025em; margin-bottom: 24px; }
        .splash-spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.08); border-top-color: #b8fa55; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
        .splash-text { color: #a8b9d0; font-size: .9rem; letter-spacing: 1px; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="app/styles/themes.css" rel="stylesheet" />
    <link href="app/styles/main.css" rel="stylesheet" />
    <link href="app/modules/auth/auth.css" rel="stylesheet" />
    <link href="app/modules/profile/profile.css" rel="stylesheet" />
    <link href="app/modules/dashboard/dashboard.css" rel="stylesheet" />
    <link href="app/modules/friends/friends.css" rel="stylesheet" />
    <link href="app/modules/quiz/quiz.css" rel="stylesheet" />
    <link href="app/modules/leaderboard/leaderboard.css" rel="stylesheet" />
    <link href="app/modules/achievements/achievements.css" rel="stylesheet" />
    <link href="app/modules/shop/shop.css" rel="stylesheet" />
    <link href="app/modules/chat/chat.css" rel="stylesheet" />
    <link href="app/modules/events/events.css" rel="stylesheet" />
    <link href="app/modules/loader/loader.css" rel="stylesheet" />
    <link href="app/styles/midnight-arcade.css" rel="stylesheet" />
</head>
<body>
    <div id="initial-splash" role="status" aria-live="polite">
        <div class="splash-inner">
            <img class="splash-logo" src="./app/assets/quizhub-mark.svg" alt="" aria-hidden="true" /><div class="splash-name" aria-hidden="true">QuizHub</div>
            <div class="splash-spinner" aria-hidden="true"></div>
            <p class="splash-text">Загрузка QuizHub...</p>
        </div>
    </div>
    <div id="app-root"></div>
    <canvas id="particles-canvas" aria-hidden="true"></canvas>
    <script type="module">
        import './app/firebase-config.js';
        import './app/modules/particles/particles.js';
        import './app/app.js';

        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((error) => console.warn('Service Worker недоступен:', error));
            }, { once: true });
        }
    </script>
</body>
</html>
